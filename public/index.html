<!DOCTYPE html>
<html>
<head>
  <title>NovaAgent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .app {
      max-width: 800px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      background: #1e293b;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    header p {
      color: #94a3b8;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 15px;
      max-width: 75%;
    }

    .bot {
      background: #1e293b;
    }

    .user {
      background: #4f46e5;
      margin-left: auto;
    }

    form {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: #1e293b;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <h1>🤖 NovaAgent</h1>
      <p>AI Assistant by Ahmad bin Shifa</p>
    </header>

    <div id="chat">
      <div class="message bot">
        Hi! I'm NovaAgent. How can I help you?
      </div>
    </div>

    <form id="chatForm">
      <input id="message" placeholder="Message NovaAgent..." autocomplete="off">
      <button type="submit">Send</button>
    </form>

  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      chat.innerHTML += `
        <div class="message user">${message}</div>
        <div class="message bot">Thinking...</div>
      `;

      input.value = "";
      chat.scrollTop = chat.scrollHeight;
    });
  </script>
</body>
</html>
