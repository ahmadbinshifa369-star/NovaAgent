<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NovaAgent</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
    }

    /* SIDEBAR */

    .sidebar {
      width: 250px;
      background: #111827;
      border-right: 1px solid #263247;
      padding: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #1f2937;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .new-chat:hover {
      background: #374151;
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px 25px;
      background: #0f172a;
      border-bottom: 1px solid #263247;
    }

    .header h1 {
      margin: 0;
      font-size: 21px;
    }

    .header p {
      margin: 5px 0 0;
      color: #94a3b8;
      font-size: 13px;
    }

    /* CHAT */

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .message {
      max-width: 750px;
      margin: 0 auto 18px;
      padding: 14px 17px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .bot {
      background: #1e293b;
    }

    .user {
      background: #4f46e5;
    }

    /* INPUT */

    .input-area {
      padding: 18px;
      background: #0f172a;
      border-top: 1px solid #263247;
    }

    form {
      max-width: 750px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    #message {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #111827;
      color: white;
      font-size: 15px;
      outline: none;
    }

    #send {
      padding: 0 22px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #send:hover {
      background: #6366f1;
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      🤖 NovaAgent
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

  </aside>


  <main class="main">

    <header class="header">

      <h1>NovaAgent</h1>

      <p>
        AI Assistant by Ahmad bin Shifa
      </p>

    </header>


    <section id="chat">

      <div class="message bot">
        👋 Hi! I'm NovaAgent.

        I'm ready to help you. Ask me anything!
      </div>

    </section>


    <div class="input-area">

      <form id="chatForm">

        <input
          id="message"
          type="text"
          placeholder="Message NovaAgent..."
          autocomplete="off"
        >

        <button id="send" type="submit">
          Send
        </button>

      </form>

    </div>

  </main>

</div>


<script>

  const form = document.getElementById("chatForm");

  const input = document.getElementById("message");

  const chat = document.getElementById("chat");


  function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
  }


  function newChat() {

    chat.innerHTML = "";

    addMessage(
      "👋 Hi! I'm NovaAgent. What can I help you with?",
      "bot"
    );

    input.focus();
  }


  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const text = input.value.trim();

    if (!text) return;


    addMessage(text, "user");

    input.value = "";


    const thinking = addMessage(
      "Thinking...",
      "bot"
    );


    try {

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: text
        })

      });


      const data = await response.json();


      thinking.textContent =
        data.reply ||
        data.error ||
        "Something went wrong.";


    } catch (error) {

      thinking.textContent =
        "⚠️ NovaAgent cannot connect right now.";

    }

  });

</script>

</body>
</html>
